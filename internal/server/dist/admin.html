<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gopad Admin</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.4;
        background: #1f2430;
        color: #d8dee9;
        margin: 0;
        padding: 16px;
      }
      h1 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #2c3242; font-size: 14px; }
      th { color: #7b859c; font-weight: 600; }
      a { color: #88c0d0; text-decoration: none; }
      a:hover { text-decoration: underline; }
      button {
        background: #2c3242; color: #d8dee9; border: 1px solid #3b4252;
        border-radius: 0; padding: 4px 10px; cursor: pointer;
        font-size: 14px; font-family: inherit;
      }
      button:hover { background: #3b4252; }
      button.danger { color: #e06c75; }
      .pager { margin-top: 16px; display: flex; gap: 10px; align-items: center; justify-content: center; }
      .muted { color: #7b859c; }
      #error { color: #e06c75; margin: 10px 0; }

      /* Mobile: rows become stacked cards with per-field labels. */
      @media (max-width: 768px) {
        body { padding: 12px; }
        thead { display: none; }
        table, tbody, tr, td { display: block; width: 100%; }
        tr { border: 1px solid #2c3242; margin-bottom: 10px; padding: 8px 10px; }
        td { border-bottom: none; padding: 2px 0; display: flex; gap: 8px; font-size: 13px; }
        td a { word-break: break-all; }
        td::before {
          content: attr(data-label);
          color: #7b859c;
          width: 76px;
          flex: none;
        }
        td.actions { display: block; padding-top: 6px; }
        td.actions::before { content: none; }
        td.actions button { width: 100%; }
      }
    </style>
    <script type="module" crossorigin src="/assets/admin-BFd8zQHJ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/format-BZtKhQPX.js">
  </head>
  <body>
    <h1>Gopad Admin <span id="total" class="muted"></span></h1>
    <div id="error"></div>
    <table>
      <thead>
        <tr>
          <th>Document</th><th>Size</th><th>Language</th><th>Conns</th>
          <th>Updated</th><th>Expires</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager">
      <button id="prev" type="button">← Prev</button>
      <span id="page-label" class="muted"></span>
      <button id="next" type="button">Next →</button>
    </div>
  </body>
</html>
